# Testy jednostkowe (katalog testy/) przy każdej zmianie kodu - bez sieci, bez okna.
# Lokalnie: python -m unittest discover -s testy -t .
name: Testy

on:
  push:
    paths: ["**.py", "requirements.txt", ".github/workflows/testy.yml"]
  pull_request:
    paths: ["**.py", "requirements.txt", ".github/workflows/testy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testy:
    # Nutka działa tylko na Windows: ścieżki, nazwy urządzeń (CON, NUL), ctypes - testy też tam
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakiety
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt
      - name: Testy
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s testy -t . -v
